appId: fit.sigap.app.staging
---
- extendedWaitUntil:
    visible: "Tiba di lokasi"
    timeout: 30000
- tapOn:
    text: "Tiba di lokasi"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Nyatakan penanganan selesai"
    timeout: 15000
- tapOn:
    text: "Nyatakan penanganan selesai"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Menunggu dokumentasi · .*"
    timeout: 15000
- tapOn:
    text: "Isi"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Dokumentasi pascakejadian"
    timeout: 15000
- scrollUntilVisible:
    element: "Ya, sudah selesai"
    direction: DOWN
- tapOn: "Ya, sudah selesai"
- tapOn:
    text: "Selesaikan"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: ".*Dokumentasi selesai.*"
    timeout: 20000
- assertNotVisible: "Simpan draft"
